<!doctype html>
<html lang="en" dir="ltr">
<!-- lang="{{ lang }}" dir="{{ direction }} -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TEMP</title>
  <!-- <title>{% block title %}{% endblock %}</title> -->

  <link rel="stylesheet" href="static/css/global.css" />
  <link rel="stylesheet" href="static/css/header.css" />
  <link rel="stylesheet" href="static/css/profiles.css" /> <!--{% block extra_css %}{% endblock %}-->
</head>

<body>

  <!-- Shared header, same one used in the dashboard pages -->
  <header>
    <div class="header-inner">
      <div id="header-logo">
        <a href="dashboard-doctor.html" aria-label="MUFSAL home">
          <img src="assets/logo-light.png" alt="MUFSAL" class="logo-img" />
        </a>
      </div>

      <div class="header-actions">
        <button type="button" id="lang-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
          </svg>
          ع
        </button>

        <a href="profile-doctor.html" class="profile-link">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </a>

        <span class="site-header__rule" aria-hidden="true"></span>

        <a href="logout.html" class="logout-link">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="profile-container">

    <!-- Page title -->
    <section class="profile-banner">

      <!-- Takes the doctor back without using the browser back button -->
      <a href="dashboard-doctor.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to Dashboard
      </a>

      <h1>My Profile</h1>
      <p class="subtitle">View your professional credentials and manage your account details.</p>
    </section>


    <!-- ============================================================
         Card 1: Professional Information
         The admin checks these during registration, so the doctor
         cannot change them here. The card has no Edit button, and
         the script skips any card that has none.
         ============================================================ -->
    <section class="card profile-card card--verified" id="professional-card">

      <div class="card-head">
        <div>
          <h2>Professional Information</h2>
          <p class="subtitle">Verified by the administrator during registration. Contact the administrator to request a change.</p>
        </div>

        <div class="icon-box" title="Verified by the administrator" aria-label="Verified by the administrator">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
      </div>

      <div class="card-body">
        <div class="field-grid">

          <!-- Role -->
          <div class="field">
            <label for="role">Professional Role</label>
            <input type="text" id="role" class="input-locked" value="Doctor" readonly disabled />
          </div>

          <!-- The licence number is the key credential, so it is highlighted -->
          <div class="field">
            <label for="license-number">SCFHS License Number / File Number</label>
            <input type="text" id="license-number" class="input-locked input-highlight"
              value="SCFHS-39518" readonly disabled />
          </div>

        </div>
      </div>
    </section>


    <!-- ============================================================
         Card 2: Personal Information
         Only the contact details can be edited. The name and the
         national ID were checked against the licence, so changing
         them here would break that check.
         ============================================================ -->
    <section class="card profile-card" id="personal-card">

      <div class="card-head">
        <h2>Personal Information</h2>

        <button type="button" class="btn-edit" data-edit="personal-card">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          Edit Profile
        </button>
      </div>

      <form class="card-body" novalidate>

        <div class="field-grid">

          <!-- Name is locked: the admin checked it against the licence -->
          <div class="field">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" class="input-locked" value="Dr. Reem Alqahtani" readonly disabled />
          </div>

          <!-- Email. It is a text box and not type="email" on purpose:
               a real email box lets the browser rewrite an Arabic domain
               by itself, so the Arabic check in the script never sees it.
               inputmode keeps the email keyboard on phones. -->
          <div class="field">
            <label for="email">Email Address</label>
            <input type="text" inputmode="email" data-check="email" id="email"
              value="reem.alqahtani@example.com" required disabled />
            <p class="error-message"></p>
          </div>

          <!-- Phone number -->
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" data-check="phone" id="phone" value="+966 50 123 4567" required disabled />
            <p class="error-message"></p>
          </div>

          <!-- The national ID arrives already masked from the server.
               The full number is never written into the page. -->
          <div class="field">
            <label for="national-id">National ID / Iqama</label>
            <div class="field-with-icon">
              <input type="text" id="national-id" class="input-locked input-with-note"
                value="10••••••67" readonly disabled />
              <span class="field-note">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                Protected identifier
              </span>
            </div>
          </div>

        </div>

        <!-- These two buttons only show up while the card is in edit mode -->
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Changes</button>
          <button type="button" class="btn-secondary" data-cancel="personal-card">Cancel</button>
        </div>

      </form>
    </section>

  </main>

  <script src="static/js/profiles.js"></script>

</body>

</html>
