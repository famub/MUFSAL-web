<!doctype html>
<html lang="en" dir="ltr">
<!-- lang="{{ lang }}" dir="{{ direction }}" -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUFSAL - Admin Dashboard</title>
  <link rel="stylesheet" href="static/css/global.css" />
  <link rel="stylesheet" href="static/css/header.css" />
  <link rel="stylesheet" href="static/css/dashboards.css" />
  <link rel="stylesheet" href="static/css/dashboard-admin.css" />
</head>

<body data-page="home">
  <header>
    <div class="header-inner">
      <div id="header-logo">
        <a href="dashboard-admin.html" aria-label="MUFSAL home">
          <img src="assets/logo-light.png" alt="MUFSAL" class="logo-img" />
        </a>
      </div>
      <div class="header-actions">
        <button type="button" id="lang-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
          </svg>
          <span id="lang-label">ع</span>
        </button>
        <a href="profile-admin.html" class="profile-link" aria-label="profile">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </a>

        <span class="site-header__rule" aria-hidden="true"></span>
        <a href="logout.html" class="logout-link" aria-label="log out">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  
  <main class="dashboard-container">
    <section class="dashboard-banner">
      <div class="banner-text">
        <span id="dashboard">dashboard</span>
        <h1>welcome back, Admin</h1>
        <p class="subtitle">track delayed requests, verify medical licenses, and handle complaints in one place.</p>
      </div>
    </section>

    <section class="stat-cards" id="stats" aria-label="overview"></section>



  </main>

  <!-- <footer>: include the team's shared footer here -->
  <dialog id="dlg"></dialog>
  <dialog id="panel" class="slide-over"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="static/js/dashboard-admin.js"></script>
</body>

</html>
