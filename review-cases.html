<!doctype html>
<html lang="en" dir="ltr">
<!-- lang="{{ lang }}" dir="{{ direction }} -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MUFSAL - Case review</title>

  <link rel="stylesheet" href="static/css/global.css" />
  <link rel="stylesheet" href="static/css/header.css" />
  <link rel="stylesheet" href="static/css/review.css" />
</head>

<body data-page="list">
  <header>
    <div class="header-inner">
      <div id="header-logo-">
        <a href="dashboard.html" aria-label="MUFSAL home">
          <img src="assets/logo-light.png" alt="MUFSAL" class="logo-img" />
        </a>
      </div>

      <div class="header-actions">
        <button type="button" id="lang-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
          </svg>
          ع
        </button>

        <a href="profile.html" class="profile-link">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
        </a>

        <span class="site-header__rule" aria-hidden="true"></span>

        <a href="logout.html" class="logout-link">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="review-main">
    <div class="page-head">
      <h1 data-i18n="reviewCases">Case review</h1>
      <p data-i18n="reviewSub">Cases waiting for your review, highest priority first.</p>
    </div>

    <div class="toolbar">
      <div class="chips" role="group" aria-label="Priority filter">
        <button type="button" class="chip" data-filter="all" aria-pressed="true" data-i18n="all">All</button>
        <button type="button" class="chip" data-filter="high" aria-pressed="false" data-i18n="high">High</button>
        <button type="button" class="chip" data-filter="medium" aria-pressed="false" data-i18n="medium">Medium</button>
        <button type="button" class="chip" data-filter="low" aria-pressed="false" data-i18n="low">Low</button>
      </div>
      <input id="search" class="search" type="search" data-i18n-ph="search" placeholder="Search by patient name" />
    </div>

    <div id="table-card" class="card table-card">
      <table class="cases-table">
        <thead>
          <tr>
            <th data-i18n="colPatient">Patient</th>
            <th data-i18n="colSource">Source</th>
            <th data-i18n="colDate">Submitted</th>
            <th data-i18n="colPriority">Priority</th>
            <th><span class="sr-only"></span></th>
          </tr>
        </thead>
        <tbody id="cases-body"></tbody>
      </table>
    </div>

    <div id="empty-state" class="card empty-state hidden">
      <span class="icon-box"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></span>
      <p id="empty-text" data-i18n="noCases">There are no pending cases.</p>
    </div>
  </main>

  <!-- TODO: paste the team's shared footer here (the footer was not included in what I received) -->

  <script src="static/js/mock-cases.js"></script>
  <script src="static/js/review.js"></script>
</body>

</html>
