<!doctype html>
<html lang="en" dir="ltr">
<!-- lang="{{ lang }}" dir="{{ direction }} -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MUFSAL - Reset password</title>

  <link rel="stylesheet" href="static/css/global.css" />
  <link rel="stylesheet" href="static/css/header.css" />
  <link rel="stylesheet" href="static/css/profiles.css" />
  <link rel="stylesheet" href="static/css/auth.css" />
</head>

<body data-page="reset" data-title="resetTitle">

  <header>
    <div class="header-inner">
      <div id="header-logo">
        <a href="login.html" aria-label="MUFSAL home">
          <img src="assets/logo-light.png" alt="MUFSAL" class="logo-img" />
        </a>
      </div>

      <div class="header-actions">
        <button type="button" id="lang-toggle">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
          </svg>
          <span id="lang-label">ع</span>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-main">

    <section class="auth-head">
      <h1 data-i18n="resetTitle">Create a new password</h1>
      <p class="subtitle" data-i18n="resetSub">Choose a new password for your account.</p>
    </section>

    <section class="card auth-card">
      <div class="card-body auth-stack">

        <div class="alert" id="form-alert" role="alert"></div>

        <form class="auth-stack" id="reset-form" novalidate>

          <div class="field">
        <label for="password" data-i18n="newPassword">New password</label>
        <div class="field-with-icon">
          <input type="password" id="password" autocomplete="new-password" data-check="password" required />
          <button type="button" class="pw-toggle" data-target="password" data-i18n-label="showHidePw" aria-label="Show or hide password" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p class="field-hint" data-i18n="pwHint">8 to 20 characters, with an uppercase letter, a lowercase letter, a number and a special character.</p>
        <p class="error-message"></p>
      </div>

          <div class="field">
        <label for="confirm-password" data-i18n="confirmPassword">Confirm password</label>
        <div class="field-with-icon">
          <input type="password" id="confirm-password" autocomplete="new-password" data-check="confirm" data-match="password" required />
          <button type="button" class="pw-toggle" data-target="confirm-password" data-i18n-label="showHidePw" aria-label="Show or hide password" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p class="error-message"></p>
      </div>

          <button type="submit" class="btn-primary btn-block" data-i18n="resetBtn">Save new password</button>

        </form>

        <p class="auth-links">
          <a class="link" href="login.html" data-i18n="backToLogin">Back to log in</a>
        </p>

      </div>
    </section>

  </main>

  <script src="static/js/mock-users.js"></script>
  <script src="static/js/auth.js"></script>

</body>

</html>
