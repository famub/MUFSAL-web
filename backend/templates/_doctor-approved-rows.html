{# One <tr> per approved case. Used by dashboard-doctor.html and doctor-cases.html. Needs: t, lang, approved. #}
            {% for c in approved %}
            <tr>
              <td>
                <div class="case-id-cell">
                  <div class="icon-box icon-box--sm"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg></div>
                  <strong><bdi>{{ c.national_id }}</bdi></strong>
                </div>
              </td>
              <td>
                <div class="date-cell">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  <span>{{ c.date }}</span>
                </div>
              </td>
              <td><div class="grade-cell"><span class="grade-pill grade-{{ c.final_grade }}">KL {{ c.final_grade }}</span></div></td>
              <td>
                <div class="actions-cell">
                  <span class="view-report">
                    <a href="/cases/{{ c.case_id }}/report">{{ t.view_report }}</a>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="{{ 'M15 19l-7-7 7-7' if lang == 'ar' else 'M9 5l7 7-7 7' }}" /></svg>
                  </span>
                </div>
              </td>
            </tr>
            {% endfor %}
