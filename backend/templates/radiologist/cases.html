<!doctype html>
<html lang="{{ lang }}" dir="{{ direction }}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUFSAL — {{ t.all_title }}</title>
  {% include "_new-head.html" %}
</head>

<body>

  {% set rail_role = "radiologist" %}{% set nav_active = "cases" %}{% include "_rail.html" %}

  <main class="main">
    <div class="main-inner">

      <div class="topbar">
        <div>
          <h1>{{ t.all_title }}</h1>
          <p>{{ t.all_sub }}</p>
        </div>
        <a class="btn btn-ghost" href="/dashboard-radiologist">{{ t.back }}</a>
      </div>

      {% if cases %}
      <div class="case-list">{% include "radiologist/_rows.html" %}</div>
      {% else %}
      <div class="empty"><h3>{{ t.none }}</h3></div>
      {% endif %}

      {% include "_page-foot.html" %}
    </div>
  </main>

</body>

</html>
