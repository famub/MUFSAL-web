<!doctype html>
<html lang="{{ lang }}" dir="{{ direction }}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MUFSAL - {{ t.case_no }} {{ case.case_id }}</title>

  <link rel="stylesheet" href="/static/css/global.css" />
  <link rel="stylesheet" href="/static/css/header.css" />
  <link rel="stylesheet" href="/static/css/review.css" />
  <link rel="stylesheet" href="/static/css/footer.css" />
  <link rel="stylesheet" href="/static/css/doctor-nav.css" />
</head>

<body>
  <header>
    <div class="header-inner">
      <div id="header-logo-">
        <a href="/dashboard-doctor" aria-label="MUFSAL home">
          <img src="/assets/logo-light.png" alt="MUFSAL" class="logo-img" />
        </a>
      </div>

      <div class="header-actions">
        <form action="/set-lang" method="get">
          <input type="hidden" name="lang" value="{{ 'en' if lang == 'ar' else 'ar' }}" />
          <input type="hidden" name="next" value="{{ request.url.path }}" />
          <button type="submit" id="lang-toggle">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
            </svg>
            {{ t.lang_button }}
          </button>
        </form>


        <span class="site-header__rule" aria-hidden="true"></span>

        <a href="/logout" class="logout-link">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
      </div>
    </div>
  </header>

  <div class="doctor-shell">
  {% set nav_active = "pending" %}{% include "_doctor-nav.html" %}

  <main class="review-main">
    <a class="back-link" href="/dashboard-doctor"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg><span>{{ t.back }}</span></a>

    <div class="page-head case-title">
      <div>
        <h1>{{ t.case_no }} {{ case.case_id }}</h1>
        <p>{{ case.patient_name }}</p>
      </div>
      <div class="meta">
        {% if ai %}<span class="badge badge-{{ ai.priority }}">{{ t[ai.priority] }}</span>{% endif %}
        <span class="badge
